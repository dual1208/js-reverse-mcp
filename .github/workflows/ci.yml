name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  presubmit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.5
          - 22.12.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run presubmit

  portable-browsers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python -m unittest discover -s tests/deployment -v
        env:
          JS_REVERSE_INTEGRATION: '1'
      - run: node --test build/tests/managed.integration.test.js
        env:
          JS_REVERSE_INTEGRATION: '1'
